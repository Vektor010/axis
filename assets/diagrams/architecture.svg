<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181826"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="#0B0B12"/>
  
  <!-- Presentation Layer -->
  <rect x="40" y="40" width="720" height="90" rx="10" fill="url(#cardGrad)" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="60" y="70" fill="#A78BFA" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">PRESENTATION LAYER (WPF / XAML / MVVM)</text>
  <text x="60" y="100" fill="#E8E8F2" font-family="Segoe UI, sans-serif" font-size="12">MainWindow • MainViewModel • TweakCardViewModel • VirtualizingStackPanel (Direct Viewport)</text>

  <!-- Core Services Layer -->
  <rect x="40" y="155" width="720" height="90" rx="10" fill="url(#cardGrad)" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="60" y="185" fill="#22D3EE" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">ENGINE &amp; TELEMETRY LAYER</text>
  <text x="60" y="215" fill="#E8E8F2" font-family="Segoe UI, sans-serif" font-size="12">TweakEngine • SystemInfoService • RestorePointManager • GameModeWnfService</text>

  <!-- Storage & OS Layer -->
  <rect x="40" y="270" width="720" height="90" rx="10" fill="url(#cardGrad)" stroke="#22C55E" stroke-width="1.5"/>
  <text x="60" y="300" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">PERSISTENCE &amp; WINDOWS OS INTEGRATION</text>
  <text x="60" y="330" fill="#E8E8F2" font-family="Segoe UI, sans-serif" font-size="12">Windows Registry (Win32) • state.json (Isolated Snapshots) • journal.jsonl • VSS Shadow Copies</text>
</svg>
