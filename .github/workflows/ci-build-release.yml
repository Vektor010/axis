name: Build, Verify & Release Axis

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Axis.exe and Run Full Verification Suite
        shell: powershell
        run: |
          .\build.ps1

      - name: Upload Axis.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axis-windows-x64
          path: dist/Axis.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Axis.exe
          generate_release_notes: true
